name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned to the default branch's HEAD as of 2026-09-11 -- previously installed
  # unpinned (always whatever's on the default branch right now), which could
  # silently change CI behavior on an upstream push. Bump deliberately.
  WRAPT_TIMEOUT_DECORATOR_REF: 290c67b64b14bf376d0d122cf4d2ccbe038c1b51
  MULTINEST_REF: ced3839f3c9dd2e8dc101be0372d39c39eca99cb

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
      - name: Check uv.lock is up to date
        run: uv lock --check

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # setuptools-scm needs tag history to resolve the version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache fiesta-surrogates
        uses: actions/cache@v4
        with:
          path: fiesta-surrogates
          key: fiesta-surrogates-${{ hashFiles('**/LICENSE') }}
          restore-keys: fiesta-surrogates-

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas3 libblas-dev python3-mpi4py \
          build-essential openmpi-bin libopenmpi-dev liblapack3 \
          liblapack-dev libatlas-base-dev gfortran

      - name: Install Python dependencies
        run: |
          uv pip install --system --upgrade "git+https://github.com/bitranox/wrapt_timeout_decorator.git@${{ env.WRAPT_TIMEOUT_DECORATOR_REF }}"
          uv pip install --system -e ".[grb,dev]"

      - name: Cache MultiNest build
        id: cache-multinest
        uses: actions/cache@v4
        with:
          path: MultiNest
          key: multinest-${{ env.MULTINEST_REF }}-${{ runner.os }}

      - name: Build MultiNest
        if: steps.cache-multinest.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/JohannesBuchner/MultiNest
          cd MultiNest && git checkout "$MULTINEST_REF" && cd build
          rm -rf *
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          make

      - name: Export libraries
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/MultiNest/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/MultiNest/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Download fiesta-surrogates from HuggingFace
        run: |
          hf download nuclear-multimessenger-astronomy/fiesta-surrogates \
            --repo-type model --local-dir fiesta-surrogates
          echo "NMMA_FIESTA_SURROGATES=$GITHUB_WORKSPACE/fiesta-surrogates" >> $GITHUB_ENV

      - name: Run pytest
        run: python -m coverage run --source nmma -m pytest
        env:
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.DYLD_LIBRARY_PATH }}
          NMMA_FIESTA_SURROGATES: ${{ env.NMMA_FIESTA_SURROGATES }}

      - name: Run Coveralls
        if: ${{ success() }}
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
          COVERALLS_FLAG_NAME: run-${{ matrix.python-version }}

  coveralls-finish:
    name: Indicate completion to coveralls.io
    needs: pytest
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Finished
        run: |
          pip3 install coveralls==3.3.1
          coveralls --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
