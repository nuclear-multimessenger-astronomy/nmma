name: Weekly Unstable Release

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual override triggers from the dev branch

jobs:
  release:
    if: github.repository_owner == 'nuclear-multimessenger-astronomy'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0 # Fetches full history for accurate weekly logs
          submodules: recursive # Retains submodules if your project relies on them

      - name: Check for New Commits and Generate Changelog
        id: changelog
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SINCE_FILTER="--since='7 days ago'"
          else
            SINCE_FILTER="-n 20"
          fi

          # Get a clean list of commits, skipping automatic merge commits
          git log $SINCE_FILTER --no-merges --pretty=format:"- %h: %s" > changelog.txt
          
          COMMITS_COUNT=$(wc -l < changelog.txt)
          echo "Commits found: $COMMITS_COUNT"
          
          if [ "$COMMITS_COUNT" -eq 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No new changes found on the dev branch this week. Skipping release."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Save the changelog into env safely
            echo "CHANGELOG_TEXT<<EOF" >> $GITHUB_ENV
            cat changelog.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Early Exit if No Changes
        if: github.event_name == 'schedule' && steps.changelog.outputs.has_changes == 'false'
        run: |
          gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Visual Tag and Date
        id: info
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      # Uses git archive to safely compress the repository, stripping out internal .git bloat
      - name: Generate Source Code Archives
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=nmma-unstable/ HEAD -o dist/nmma-unstable-${{ steps.info.outputs.timestamp }}.tar.gz
          git archive --format=zip --prefix=nmma-unstable/ HEAD -o dist/nmma-unstable-${{ steps.info.outputs.timestamp }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unstable
          name: "Unstable Preview (${{ steps.info.outputs.date }}) "
          body: |
            ## ⚠️ Unstable Preview Build (Dev Branch)
            This release contains a weekly automated snapshot of the **dev** branch. It may be unstable.
            
            **Built on:** ${{ steps.info.outputs.date }}
            
            ### What's Changed:
            ${{ env.CHANGELOG_TEXT }}
          prerelease: true
          make_latest: false
          files: |
            dist/*.tar.gz
            dist/*.zip
