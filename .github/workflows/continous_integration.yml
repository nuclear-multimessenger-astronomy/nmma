name: Unit Test nmma [ubuntu]

on:
  push:
    branches:
      - main
    paths-ignore:
      - "doc/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "nmma/**"
      - "pyproject.toml"
      - "*_requirements.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout branch being tested
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python with Conda ${{ matrix.python-version }}
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          use-mamba: true
          mamba-version: "*"
          activate-environment: nmma_env
          channels: defaults

      - name: Cache fiesta-surrogates
        uses: actions/cache@v4
        with:
          path: fiesta-surrogates
          key: fiesta-surrogates-${{ hashFiles('**/LICENSE') }}
          restore-keys: fiesta-surrogates-

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas3 libblas-dev python3-mpi4py \
          build-essential openmpi-bin libopenmpi-dev liblapack3 \
          liblapack-dev libatlas-base-dev gfortran

      - name: Install Python dependencies
        run: |
          uv pip install --system --upgrade git+https://github.com/bitranox/wrapt_timeout_decorator.git
          uv pip install --system -e ".[grb,dev]"
          git clone https://github.com/JohannesBuchner/MultiNest && cd MultiNest/build && rm -rf *  && cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .. && make && cd ../..

      - name: Export Libraries
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/MultiNest/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/MultiNest/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check .

      - name: Download fiesta-surrogates from HuggingFace
        run: |
          hf download nuclear-multimessenger-astronomy/fiesta-surrogates \
            --repo-type model --local-dir fiesta-surrogates
          echo "NMMA_FIESTA_SURROGATES=$GITHUB_WORKSPACE/fiesta-surrogates" >> $GITHUB_ENV

      - name: Test with pytest
        run: |
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          echo "DYLD_LIBRARY_PATH: $DYLD_LIBRARY_PATH"
          python -m coverage run --source nmma -m pytest nmma/tests/*/*.py
        env:
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
          DYLD_LIBRARY_PATH: ${{ env.DYLD_LIBRARY_PATH }}
          NMMA_FIESTA_SURROGATES: ${{ env.NMMA_FIESTA_SURROGATES }}

      - name: Run Coveralls
        if: ${{ success() }}
        run: |
          coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
          COVERALLS_FLAG_NAME: run-${{ matrix.python-version }}

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[doc]"

      - name: Build Documentation (Strict)
        run: |
          sphinx-build -W --keep-going -b html doc/ doc/_build/html  

  
  coveralls-finish:
    name: Indicate completion to coveralls.io
    needs: build
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Finished
        run: |
          pip3 install --upgrade coveralls
          coveralls --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}